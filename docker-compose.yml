services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sct
      POSTGRES_PASSWORD: sct
      POSTGRES_DB: sct
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sct -d sct"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://sct:sct@db:5432/sct
      API_KEY: demo-key
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend:80
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
